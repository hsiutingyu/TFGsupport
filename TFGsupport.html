<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#004E1A">
  <meta name="description" content="製作專屬 TFG 挺巧慧方形應援圖，可選級別與稱呼，下載高解析 PNG 或 JPEG。">
  <title>TFG 挺巧慧｜製作我的應援圖</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#163b27;background:#f5f5ef}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh}
    header{background:#004e1a;color:#fff8e9;padding:20px max(24px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:900;letter-spacing:.045em;font-size:21px}
    .tag{font-size:13px;color:#c9e0cc;letter-spacing:.06em}
    main{max-width:1100px;margin:0 auto;padding:46px 24px 64px;display:grid;grid-template-columns:minmax(280px,390px) minmax(350px,1fr);gap:56px;align-items:start}
    h1{font-size:clamp(28px,3.4vw,42px);line-height:1.2;margin:0 0 16px;letter-spacing:.02em}
    .intro{font-size:16px;line-height:1.7;color:#536559;margin:0 0 30px}
    .form{background:#fff;border:1px solid #dbe5dc;border-radius:20px;padding:26px;box-shadow:0 14px 40px #0b3b1710}
    label{display:block;font-weight:800;font-size:16px;margin-bottom:10px}
    .hint{display:block;font-size:13px;color:#6c7f70;font-weight:400;margin-top:4px}
    .field+.field{margin-top:24px}
    input,select{width:100%;border:1.5px solid #bfd0c2;border-radius:11px;background:#fff;color:#173f29;font:600 18px/1.3 inherit;padding:14px 16px;min-height:54px;outline:none}
    input:focus,select:focus{border-color:#e96924;box-shadow:0 0 0 4px #e9692426}
    input::placeholder{color:#9aaa9d}
    .year-wrap{display:flex;gap:10px}
    .year-wrap input{min-width:0}
    .clear{flex:none;border:1px solid #bfd0c2;background:#f8faf7;color:#42604a;border-radius:11px;padding:0 16px;font-weight:700;cursor:pointer}
    .clear:hover{background:#e9f1e9}
    #custom-wrap{margin-top:12px}
    #custom-wrap[hidden]{display:none}
    .message{min-height:24px;color:#aa3e22;font-size:13px;margin:8px 0 0}
    .downloads{display:grid;gap:11px;margin-top:23px}
    button.download{border:0;border-radius:12px;padding:15px 18px;min-height:54px;font:800 16px/1.2 inherit;cursor:pointer;transition:transform .15s,filter .15s}
    button.download:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.04)}
    button.download:disabled{opacity:.55;cursor:not-allowed}
    .png{background:#f26a21;color:#fff}
    .jpeg{background:#004e1a;color:#fff}
    .export-note{font-size:12px;color:#69796d;margin:13px 0 0;line-height:1.5}
    .preview-area{min-width:0}
    .preview-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
    .preview-top h2{font-size:18px;margin:0}
    .preview-top span{font-size:13px;color:#718175}
    .preview-frame{background:#e2e9e1;border:1px solid #cfddd0;padding:14px;border-radius:22px;box-shadow:0 18px 50px #123b1c20}
    canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#004e1a;border-radius:8px}
    .footer{max-width:1100px;margin:0 auto;padding:0 24px 30px;color:#819086;font-size:12px}
    @media(max-width:820px){main{grid-template-columns:1fr;gap:34px;max-width:600px;padding-top:30px}.preview-area{grid-row:1}.preview-frame{max-width:500px}.tag{display:none}}
    @media(max-width:520px){header{padding:16px 20px}.brand{font-size:18px}main{padding:24px 16px 42px;gap:24px}.form{padding:22px}.preview-frame{padding:9px;border-radius:15px}}
  </style>
</head>
<body>
  <header><div class="brand">TFG · 挺巧慧</div><div class="tag">一起做自己的應援圖</div></header>
  <main>
    <section aria-labelledby="page-title">
      <h1 id="page-title">製作我的應援圖</h1>
      <p class="intro">選擇級別與稱呼，右邊會立即顯示方形版本。完成後可直接下載高解析圖片。</p>
      <div class="form">
        <div class="field">
          <label for="grade">級別數字<span class="hint">可修改，也可留白</span></label>
          <div class="year-wrap"><input id="grade" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="83" placeholder="例如 83" autocomplete="off"><button class="clear" id="clear-grade" type="button" aria-label="清空級別數字">清空</button></div>
        </div>
        <div class="field">
          <label for="relation">稱呼</label>
          <select id="relation">
            <option>同學</option><option>學姊</option><option>學妹</option><option>朋友</option><option>同鄉</option><option value="custom">自填兩字</option>
          </select>
          <div id="custom-wrap" hidden><label for="custom" class="hint">輸入兩個字</label><input id="custom" type="text" maxlength="2" placeholder="請輸入兩個字" autocomplete="off"></div>
          <p class="message" id="message" role="status" aria-live="polite"></p>
        </div>
        <div class="downloads">
          <button class="download png" id="download-png" type="button" disabled>下載 PNG 圖片</button>
          <button class="download jpeg" id="download-jpeg" type="button" disabled>下載 JPEG 圖片</button>
        </div>
        <p class="export-note">方形 3600 × 3600 像素。圖片在您的裝置上製作，填入的文字不會上傳。</p>
      </div>
    </section>
    <section class="preview-area" aria-labelledby="preview-title">
      <div class="preview-top"><h2 id="preview-title">即時預覽</h2><span>方形版</span></div>
      <div class="preview-frame"><canvas id="preview" width="1200" height="1200" role="img" aria-label="目前的 TFG 挺巧慧應援圖預覽"></canvas></div>
    </section>
  </main>
  <div class="footer">TFG 挺巧慧 · 自製應援圖</div>

      const chars = value.split('');
      if (chars.length === 1) drawDigit(ctx, chars[0], 572, 160, 1);
      else if (chars.length === 2) chars.forEach((c, i) => drawDigit(ctx, c, 500 + i * 124, 160, 1));
      else chars.forEach((c, i) => drawDigit(ctx, c, 505 + i * 101, 181, .81));
    }
    async function render(canvas, state, isCurrent = () => true) {
      await ready;
      const roleImage = state.isCustom && state.role ? await customRoleImage(state.role) : null;
      if (!isCurrent()) return;
      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.scale(canvas.width / 1200, canvas.height / 1200);
      ctx.drawImage(images.base, 0, 0, 1200, 1200);
      drawGrade(ctx, state.grade);
      if (state.isCustom) {
        if (roleImage) ctx.drawImage(roleImage, 0, 0, 1200, 1200);
      } else ctx.drawImage(images[`role:${state.role}`], 240, 425, 450, 230);
      ctx.restore();
    }
    const state = () => ({ grade: grade.value, role: chosenRole(), isCustom: relation.value === 'custom' });
    async function update() {
      refreshState();
      const current = ++serial;
      const next = state();
      try {
        await render(preview, next, () => current === serial);
        if (current === serial) preview.setAttribute('aria-label', `TFG ${next.grade || '無級別'} ${next.role}挺巧慧方形應援圖`);
      } catch (error) { message.textContent = '預覽製作失敗，請重新整理頁面。'; pngButton.disabled = jpegButton.disabled = true; console.error(error); }
    }
    async function download(format) {
      if (!valid()) return;
      const buttons = [pngButton, jpegButton];
      buttons.forEach(button => button.disabled = true);
      message.textContent = '正在製作高解析圖片…';
      try {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 3600;
        const selected = state();
        await render(canvas, selected);
        const type = format === 'png' ? 'image/png' : 'image/jpeg';
        const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('Image export failed')), type, .96));
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `TFG${selected.grade || '空白'}_${selected.role}挺巧慧_方形_3600px.${format === 'png' ? 'png' : 'jpg'}`;
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        message.textContent = '圖片已開始下載。';
      } catch (error) { message.textContent = '下載製作失敗，請再試一次。'; console.error(error); }
      finally { refreshState(); }
    }
    grade.addEventListener('input', () => { grade.value = grade.value.replace(/\D/g, '').slice(0, 3); update(); });
    $('clear-grade').addEventListener('click', () => { grade.value = ''; grade.focus(); update(); });
    relation.addEventListener('change', () => { refreshState(); if (relation.value === 'custom') custom.focus(); update(); });
    custom.addEventListener('input', () => { custom.value = Array.from(custom.value).slice(0, 2).join(''); update(); });
    pngButton.addEventListener('click', () => download('png'));
    jpegButton.addEventListener('click', () => download('jpeg'));
    update();
  })();
  </script>
</body>
</html>
